# Alternative to `bun run db:up` for machines with Docker.
# Same ports and credentials as .env.example.
services:
  mongo:
    image: mongo:8.2
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27027', '--wiredTigerCacheSizeGB', '1']
    ports: ['127.0.0.1:27027:27027']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      # Initiates the single-node replica set on first start (needed for transactions and change streams).
      test: >
        mongosh --port 27027 --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27027'}]}).ok }"
      interval: 5s
      retries: 20
  neo4j:
    image: neo4j:2026.03.1-community
    environment:
      NEO4J_AUTH: neo4j/graphmart123
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports: ['127.0.0.1:7484:7474', '127.0.0.1:7697:7687']
    volumes: ['neo4j-data:/data']
  mysql:
    image: mysql:8.0
    command: ['--innodb-buffer-pool-size=1G']
    environment:
      MYSQL_ROOT_PASSWORD: graphmart123
      MYSQL_DATABASE: graphmart
      MYSQL_USER: graphmart
      MYSQL_PASSWORD: graphmart123
    ports: ['127.0.0.1:3317:3306']
    volumes: ['mysql-data:/var/lib/mysql']
volumes:
  mongo-data:
  neo4j-data:
  mysql-data:
